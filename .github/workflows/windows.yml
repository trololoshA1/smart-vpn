name: Build Windows Client

on:
  workflow_dispatch:
  push:
    paths:
      - "client-windows/**"
      - "core/**"
      - "geoip/**"
      - "adblock/**"
      - "subscriptions/**"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build EXE
        run: |
          cd client-windows
          wails build

      - name: Upload EXE
        uses: actions/upload-artifact@v3
        with:
          name: smartvpn-windows
          path: client-windows/build/bin/SmartVPN.exe